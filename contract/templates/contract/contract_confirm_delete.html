{% extends "base.html" %}

{% block title %}Delete Contract{% endblock %}

{% block content %}
  <h2>Are you sure you want to delete this contract?</h2>

  <p>
    Contract with <b>{{ object.recipient_name }}</b> ({{ object.recipient_email }})
  </p>

  <form method="post">
      {% csrf_token %}
      <button type="submit">Yes, delete</button>
      <a href="{% url 'contract_list' %}">Cancel</a>
  </form>
{% endblock %}
